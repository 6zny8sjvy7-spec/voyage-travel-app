<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOYAGE 旅行規劃</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{font:16px -apple-system,sans-serif;margin:0;background:linear-gradient(130deg,#c9e4ff,#f9fcff);color:#1d3656}body.dark{background:linear-gradient(130deg,#09162c,#203c60);color:white}main{max-width:800px;margin:auto;padding:20px}.card{padding:20px;margin:15px 0;border-radius:24px;background:#ffffffc9;box-shadow:0 8px 30px #152e4b19}.dark .card{background:#192d49d9}h1{letter-spacing:4px;margin:4px 0}button,input,select{padding:10px;border-radius:12px;border:1px solid #a9c4e0;font:inherit;background:white;color:#193656}button{cursor:pointer}.dark button,.dark input,.dark select{background:#304868;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.stop{padding:12px 0;border-bottom:1px solid #94aac466;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stop span{flex:1;min-width:90px}.done{text-decoration:line-through;opacity:.6}#map{height:330px;border-radius:15px;margin:12px 0}.small{font-size:13px;opacity:.75}#days button.active{background:#347ad0;color:white}</style><main><div class="row"><div><h1>VOYAGE</h1><div class="small">你的旅行，由你決定</div></div><select id="theme"><option value="auto">自動日夜</option><option value="light">明亮</option><option value="dark">深色</option></select></div><div class="card"><div class="row"><div><div>韓國 · 首爾</div><h2 id="weather">天氣載入中</h2><div id="weatherInfo" class="small">Open-Meteo 天氣資訊</div></div><div id="weatherIcon" style="font-size:45px">☀️</div></div></div><div class="card"><h2>每日行程</h2><div id="days" class="row"></div><div id="list"></div><div class="row" style="margin-top:15px"><input id="newStop" placeholder="輸入景點名稱"><button id="add">新增景點</button></div><p class="small">新增景點需自行確認座標，系統不會擅自更動你選的景點。</p></div><div class="card"><div class="row"><h2>真實地圖</h2><button id="gps">定位我</button></div><div id="map"></div><p class="small">地圖標記使用真實座標；連接虛線僅表示順序，不代表道路導航。真正交通路線仍待串接。</p></div><div class="card"><b>開發狀態</b><p>已可操作：日夜切換、即時天氣、行程新增/刪除/排序/完成、地圖、導航連結、瀏覽器本機儲存。</p><p class="small">尚未完成：道路路線計算、地鐵即時資訊、AI 推薦、跨裝置同步及背景提醒。</p></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const defaults=[[{name:'景福宮',lat:37.5796,lon:126.977},{name:'北村韓屋村',lat:37.5826,lon:126.9836},{name:'仁寺洞',lat:37.5743,lon:126.985}],[{name:'聖水洞',lat:37.5445,lon:127.0563},{name:'首爾林',lat:37.5446,lon:127.0374}],[{name:'明洞',lat:37.5636,lon:126.9869},{name:'南山首爾塔',lat:37.5512,lon:126.9882}]];let data;try{data=JSON.parse(localStorage.getItem('voyage-data'))||defaults}catch(e){data=defaults}let day=0;const map=L.map('map').setView([37.5665,126.978],12),markers=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);function save(){localStorage.setItem('voyage-data',JSON.stringify(data))}function render(){document.querySelector('#days').innerHTML=data.map((_,i)=>'<button class="'+(i===day?'active':'')+'" onclick="day='+i+';render()">第'+(i+1)+'天</button>').join('');const list=document.querySelector('#list');list.replaceChildren();data[day].forEach((s,i)=>{const line=document.createElement('div');line.className='stop';const check=document.createElement('input');check.type='checkbox';check.checked=!!s.done;check.onchange=()=>{s.done=check.checked;save();render()};const label=document.createElement('span');label.textContent=(i+1)+'. '+s.name;label.className=s.done?'done':'';line.append(check,label);for(const [title,fn] of [['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['導航',()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.lat?s.lat+','+s.lon:s.name),'_blank')],['刪除',()=>{if(confirm('確定刪除？')){data[day].splice(i,1);save();render()}}]]){let b=document.createElement('button');b.textContent=title;b.onclick=fn;line.append(b)}list.append(line)});markers.clearLayers();const pts=[];data[day].forEach((s,i)=>{if(s.lat&&s.lon){L.marker([s.lat,s.lon]).bindPopup((i+1)+'. '+s.name).addTo(markers);pts.push([s.lat,s.lon])}});if(pts.length>1)L.polyline(pts,{color:'#438bdb',dashArray:'5 8'}).addTo(markers);if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.3));setTimeout(()=>map.invalidateSize(),100)}function move(i,d){const j=i+d;if(j<0||j>=data[day].length)return;[data[day][i],data[day][j]]=[data[day][j],data[day][i]];save();render()}document.querySelector('#add').onclick=()=>{const field=document.querySelector('#newStop'),name=field.value.trim();if(!name)return;data[day].push({name});field.value='';save();render()};document.querySelector('#gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],15),e=>alert(e.message));let mode=localStorage.getItem('voyage-theme')||'auto',sunrise=6,sunset=18;document.querySelector('#theme').value=mode;function apply(){const now=new Date(),fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'numeric',minute:'numeric',hourCycle:'h23'}).format(now).split(':');const hour=+fmt[0]+(+fmt[1])/60;document.body.classList.toggle('dark',mode==='dark'||mode==='auto'&&(hour<sunrise||hour>=sunset))}document.querySelector('#theme').onchange=e=>{mode=e.target.value;localStorage.setItem('voyage-theme',mode);apply()};async function loadWeather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m,weather_code,is_day&daily=sunrise,sunset&forecast_days=1&timezone=Asia%2FSeoul',res=await fetch(url),w=await res.json(),c=w.current,code=c.weather_code;document.querySelector('#weather').textContent=c.temperature_2m+'°C';document.querySelector('#weatherIcon').textContent=code>=71&&code<=86?'❄️':code>=51&&code<=67||code>=80&&code<=82?'🌧️':code>=1&&code<=3?'☁️':c.is_day?'☀️':'🌙';document.querySelector('#weatherInfo').textContent='首爾天氣 · 更新 '+c.time.replace('T',' ');const toHour=s=>+s.slice(11,13)+(+s.slice(14,16))/60;sunrise=toHour(w.daily.sunrise[0]);sunset=toHour(w.daily.sunset[0]);apply()}catch(e){document.querySelector('#weather').textContent='暫無天氣資料'}}render();apply();loadWeather();setInterval(apply,60000);</script></html>
