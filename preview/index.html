<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VOYAGE · Preview</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;--bg:#f1f5fc;--fg:#152946;--card:#fff;--sub:#6b809a;--line:#dce5f2;--blue:#326dd5}body.dark{--bg:#091426;--fg:#f1f6ff;--card:#182a44;--sub:#a6b9d4;--line:#314763;--blue:#79aaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);transition:.25s}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:980px;margin:auto;padding:22px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:29px;font-weight:800;letter-spacing:.15em}.small{color:var(--sub);font-size:13px}.pill,.btn{background:#e7effd;color:#234e8b;padding:12px 15px;border-radius:15px;font-weight:700}.dark .pill,.dark .btn{background:#263e5d;color:#e4efff}.hero{border-radius:29px;padding:30px 24px;margin:22px 0;color:white;background:linear-gradient(120deg,#163d76b8,#407fbd55),url('https://images.unsplash.com/photo-1538485399081-7c8970e95b95?w=1200') center/cover;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 36px #274c7e24}.hero h1{font-size:40px;margin:8px 0}.hero .meta{font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:15px 0;box-shadow:0 8px 25px #203d6110}h2{font-size:21px;margin:0 0 15px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.flex{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--sub)}.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.day{min-width:80px;border-radius:17px;background:var(--bg);color:var(--fg);padding:13px}.day.active,.primary{background:var(--blue);color:white}.stop{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.stop:last-child{border-bottom:0}.dot{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--blue);color:white;text-align:center;line-height:28px;font-size:13px;font-weight:800}.stopmain{flex:1;min-width:0}.stopmain b{font-size:17px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{padding:9px 11px;border-radius:10px;background:var(--bg);color:var(--fg);font-size:13px}.fields{display:grid;grid-template-columns:100px 1fr auto;gap:8px;margin-top:16px}input,select{min-width:0;width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--fg)}#map{height:430px;border-radius:20px;overflow:hidden}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;color:var(--sub);font-size:12px;padding:5px 8px;min-width:60px}.nav button.active{color:var(--blue);font-weight:800}.nav i{display:block;font-size:22px;font-style:normal;margin-bottom:4px}.view{display:none}.view.active{display:block}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.badge{display:inline-block;padding:5px 10px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--sub)}.wide{width:100%;margin-top:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px;border-radius:12px;background:var(--bg);font-size:13px;color:var(--sub)}@media(max-width:450px){.app{padding:18px 14px 105px}.hero h1{font-size:34px}.fields{grid-template-columns:85px 1fr}.fields button{grid-column:1/-1}#map{height:390px}}</style></head><body><main class="app"><header class="top"><div><div class="logo">VOYAGE</div><div class="small">每一段旅程，都值得珍藏</div></div><div class="flex"><select id="tripSel" aria-label="選擇旅行"></select><button class="pill" id="theme">◐</button></div></header>
<section id="home" class="view active"><div class="hero"><div><div class="meta" id="heroCity"></div><h1 id="heroTitle"></h1><div id="heroDate"></div></div><div class="row"><div><div style="font-size:35px;font-weight:800" id="temp">--°</div><div id="weatherText">正在讀取天氣</div></div><div style="font-size:40px" id="weatherIcon">☀</div></div></div><div class="card"><h2>旅行總覽</h2><div class="split"><button class="btn" onclick="go('plan')">◷ 每日行程</button><button class="btn" onclick="go('mapview')">◎ 行程地圖</button><button class="btn" onclick="go('explore')">✧ 探索美食景點</button><button class="btn" onclick="go('records')">▤ 旅行紀錄</button></div></div><div class="card"><h2>今日安排</h2><div id="homeStops"></div></div></section>
<section id="plan" class="view"><div class="card"><div class="row"><h2>每日行程</h2><span class="badge">依時間自動排序</span></div><div id="days" class="tabs"></div><div id="stops"></div><div class="fields"><input id="time" type="time" value="12:00"><input id="name" placeholder="景點、餐廳或咖啡廳名稱"><button class="btn primary" id="add">＋ 加入</button></div><p class="small">新增後會自動排序。未經確認，不會自動替換你選擇的景點。</p></div></section>
<section id="mapview" class="view"><div class="card"><div class="row"><h2>行程地圖</h2><button class="btn" id="locate">◎ 我的定位</button></div><div id="map"></div><p class="small" id="mapStatus">地圖顯示已確認座標的景點；連線服務未完成時不會虛構道路路線。</p><div class="flex"><button class="btn" id="gmap">Google 地圖</button><button class="btn" id="nmap">NAVER 地圖</button></div></div></section>
<section id="explore" class="view"><div class="card"><h2>探索目的地</h2><p class="muted">依旅行城市搜尋真實網站的美食、咖啡廳、購物與景點資訊。</p><div class="flex"><button class="btn" onclick="searchPlaces('必吃餐廳 推薦')">🍜 美食</button><button class="btn" onclick="searchPlaces('咖啡廳 推薦')">☕ 咖啡</button><button class="btn" onclick="searchPlaces('必去景點')">🏛 景點</button><button class="btn" onclick="searchPlaces('購物 必買')">🛍 購物</button></div><p class="notice">目前提供真實網站搜尋入口；AI 跨站彙整與評價分析尚未串接，不會把固定清單冒充 AI 推薦。</p></div><div class="card"><h2>想去清單</h2><div class="fields"><input id="wishTime" type="hidden"><input id="wishName" placeholder="收藏地點名稱" style="grid-column:1/3"><button class="btn" id="wishAdd">收藏</button></div><div id="wishes"></div></div></section>
<section id="records" class="view"><div class="card"><h2>旅行歷史</h2><div id="tripList"></div><button class="btn wide" id="newTrip">＋ 建立新旅行</button></div><div class="card"><h2>旅費紀錄</h2><div class="fields"><input id="cost" type="number" min="0" placeholder="金額"><input id="costNote" placeholder="用途，例如午餐"><button class="btn" id="costAdd">新增</button></div><div id="costList"></div></div><div class="card"><h2>打包清單</h2><div class="fields"><input id="packName" placeholder="物品名稱" style="grid-column:1/3"><button class="btn" id="packAdd">新增</button></div><div id="packList"></div></div><div class="card"><h2>設定與資料</h2><p class="small">此預覽使用瀏覽器自動儲存。不同網域資料不會自動同步。</p><button class="btn" id="export">匯出 JSON 備份</button></div></section></main><nav class="nav"><button data-tab="home" class="active"><i>⌂</i>首頁</button><button data-tab="plan"><i>◷</i>行程</button><button data-tab="mapview"><i>◎</i>地圖</button><button data-tab="explore"><i>✧</i>探索</button><button data-tab="records"><i>▤</i>紀錄</button></nav>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const $=id=>document.getElementById(id),key='voyage_preview_v2',base=[{title:'首爾秋日旅行',city:'首爾',country:'韓國',lat:37.5665,lon:126.978,dates:'2026/10/26 – 10/31',days:[[{time:'09:30',name:'景福宮',lat:37.5796,lon:126.977},{time:'11:00',name:'北村韓屋村',lat:37.5826,lon:126.983},{time:'14:00',name:'仁寺洞',lat:37.574,lon:126.985}],[],[]],wishes:[],costs:[],pack:[]},{title:'東京城市散策',city:'東京',country:'日本',lat:35.6812,lon:139.7671,dates:'新旅行範例',days:[[],[],[]],wishes:[],costs:[],pack:[]}];let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.trips))state={trips:base,trip:0,day:0};let map,markers=[];function trip(){return state.trips[state.trip]}function save(){localStorage.setItem(key,JSON.stringify(state))}function sorted(){return [...(trip().days[state.day]||[])].sort((a,b)=>a.time.localeCompare(b.time))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(id){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.tab===id));window.scrollTo(0,0);if(id==='mapview')setTimeout(drawMap,100);render()}document.querySelectorAll('.nav button').forEach(e=>e.onclick=()=>go(e.dataset.tab));function render(){const t=trip();$('tripSel').innerHTML=state.trips.map((v,i)=>'<option value="'+i+'">'+esc(v.city)+'</option>').join('');$('tripSel').value=state.trip;$('heroCity').textContent=t.country+' · '+t.city;$('heroTitle').textContent=t.title;$('heroDate').textContent=t.dates;$('days').innerHTML=t.days.map((d,i)=>'<button class="day '+(i===state.day?'active':'')+'" data-day="'+i+'">DAY '+String(i+1).padStart(2,'0')+'</button>').join('');document.querySelectorAll('[data-day]').forEach(e=>e.onclick=()=>{state.day=+e.dataset.day;save();render();drawMap()});const rows=sorted();const item=(s,i,full)=>'<div class="stop"><div class="dot">'+(i+1)+'</div><div class="stopmain"><div class="small">'+esc(s.time)+'</div><b>'+esc(s.name)+'</b><div class="actions"><button data-nav="'+i+'" data-provider="naver">NAVER</button><button data-nav="'+i+'" data-provider="google">Google</button>'+(full?'<button data-del="'+i+'">移除</button>':'')+'</div></div></div>';$('stops').innerHTML=rows.map((s,i)=>item(s,i,true)).join('')||'<p class="muted">這一天還沒有行程。</p>';$('homeStops').innerHTML=rows.slice(0,3).map((s,i)=>item(s,i,false)).join('')||'<p class="muted">尚無行程</p>';document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(rows[+b.dataset.nav],b.dataset.provider));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=rows[+b.dataset.del];if(confirm('確定移除「'+s.name+'」？')){t.days[state.day].splice(t.days[state.day].indexOf(s),1);save();render();drawMap()}});$('wishes').innerHTML=t.wishes.map((w,i)=>'<div class="item">'+esc(w)+' <button class="btn" data-wish="'+i+'">加入今日行程</button></div>').join('');document.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{t.days[state.day].push({time:'12:00',name:t.wishes[+b.dataset.wish]});save();go('plan')});$('tripList').innerHTML=state.trips.map((x,i)=>'<div class="item"><b>'+esc(x.title)+'</b><div class="small">'+esc(x.country)+' · '+esc(x.city)+'</div><button class="btn" data-trip="'+i+'">開啟</button></div>').join('');document.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{state.trip=+b.dataset.trip;state.day=0;save();go('home');weather()});$('costList').innerHTML=t.costs.map(c=>'<div class="item">'+esc(c.note)+' · '+esc(c.amount)+'</div>').join('');$('packList').innerHTML=t.pack.map((p,i)=>'<div class="item"><label><input type="checkbox" data-pack="'+i+'" '+(p.done?'checked':'')+' style="width:auto"> '+esc(p.name)+'</label></div>').join('');document.querySelectorAll('[data-pack]').forEach(e=>e.onchange=()=>{t.pack[+e.dataset.pack].done=e.checked;save()})}
function nav(s,provider){const query=encodeURIComponent((s.localName||s.name)+' '+trip().city);const url=provider==='naver'?'https://map.naver.com/p/search/'+query:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.lat!=null?s.lat+','+s.lon:s.name+' '+trip().city);window.open(url,'_blank','noopener')}function searchPlaces(q){window.open('https://www.google.com/search?q='+encodeURIComponent(trip().city+' '+q),'_blank','noopener')}
$('tripSel').onchange=e=>{state.trip=+e.target.value;state.day=0;save();render();drawMap();weather()};$('add').onclick=()=>{let n=$('name').value.trim();if(!n)return alert('請輸入景點名稱');trip().days[state.day].push({name:n,time:$('time').value||'12:00'});$('name').value='';save();render()};$('wishAdd').onclick=()=>{let n=$('wishName').value.trim();if(n){trip().wishes.push(n);$('wishName').value='';save();render()}};$('costAdd').onclick=()=>{const amount=+$('cost').value;if(amount>0){trip().costs.push({amount,note:$('costNote').value||'其他'});$('cost').value='';$('costNote').value='';save();render()}};$('packAdd').onclick=()=>{let n=$('packName').value.trim();if(n){trip().pack.push({name:n,done:false});$('packName').value='';save();render()}};$('newTrip').onclick=()=>{let city=prompt('新旅行城市');if(!city)return;let country=prompt('國家','日本')||'';state.trips.push({title:city+'之旅',city,country,dates:'日期待設定',lat:35.6812,lon:139.7671,days:[[],[],[]],wishes:[],costs:[],pack:[]});state.trip=state.trips.length-1;state.day=0;save();go('home')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='voyage-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};function theme(){const hour=new Date().getHours();document.body.classList.toggle('dark',localStorage.getItem('voyage_theme')==='dark'||(localStorage.getItem('voyage_theme')!=='light'&&(hour<6||hour>=18)))}$('theme').onclick=()=>{localStorage.setItem('voyage_theme',document.body.classList.contains('dark')?'light':'dark');theme()};theme();
function drawMap(){if(!window.maplibregl){$('mapStatus').textContent='地圖服務載入失敗，請確認網路連線';return}try{if(!map){map=new maplibregl.Map({container:'map',style:'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',center:[trip().lon,trip().lat],zoom:11});map.addControl(new maplibregl.NavigationControl(),'top-right')}map.resize();markers.forEach(m=>m.remove());markers=[];const pts=sorted().filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon));pts.forEach((s,i)=>{let el=document.createElement('div');el.className='dot';el.textContent=i+1;markers.push(new maplibregl.Marker({element:el}).setLngLat([s.lon,s.lat]).setPopup(new maplibregl.Popup().setText(s.name)).addTo(map))});if(pts.length){const bounds=new maplibregl.LngLatBounds();pts.forEach(s=>bounds.extend([s.lon,s.lat]));map.fitBounds(bounds,{padding:55,maxZoom:14})}else map.flyTo({center:[trip().lon,trip().lat],zoom:11});$('mapStatus').textContent=pts.length+' 個景點已確認座標；未定位的景點不會顯示假位置。道路路線尚未串接。'}catch(e){$('mapStatus').textContent='地圖載入異常：'+e.message}}
$('locate').onclick=()=>{if(!navigator.geolocation)return alert('瀏覽器不支援定位');$('mapStatus').textContent='正在取得 GPS 位置…';navigator.geolocation.getCurrentPosition(p=>{if(!map)return;const {longitude,latitude,accuracy}=p.coords;map.flyTo({center:[longitude,latitude],zoom:15});markers.push(new maplibregl.Marker({color:'#1675ed'}).setLngLat([longitude,latitude]).addTo(map));$('mapStatus').textContent='已定位目前位置（精度約 '+Math.round(accuracy)+' 公尺）'},e=>$('mapStatus').textContent='定位失敗：'+e.message,{enableHighAccuracy:true,timeout:12000})};$('gmap').onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(trip().city),'_blank');$('nmap').onclick=()=>window.open('https://map.naver.com/p/search/'+encodeURIComponent(trip().city),'_blank');
async function weather(){const t=trip();$('weatherText').textContent='天氣查詢中';try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+t.lat+'&longitude='+t.lon+'&current=temperature_2m,weather_code&timezone=auto');if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();$('temp').textContent=Math.round(j.current.temperature_2m)+'°';const code=j.current.weather_code;$('weatherIcon').textContent=code>=71?'❄':code>=51?'☂':code>=2?'☁':'☀';$('weatherText').textContent='目前天氣 · '+t.city}catch(e){$('temp').textContent='--°';$('weatherText').textContent='目前無法取得天氣'}}render();weather();</script></body></html>
