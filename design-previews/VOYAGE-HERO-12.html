<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>VOYAGE｜首爾核准畫風・首頁動態</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#fffaf5;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#263146}
#hero{position:relative;width:100%;overflow:hidden;background:#8db8fa;border:0;border-radius:24px;isolation:isolate}
#scene{position:relative;width:100%;aspect-ratio:1448/946;container-type:inline-size;overflow:hidden;isolation:isolate}
#plate{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1;transition:filter .6s ease}
#water{position:absolute;left:25%;right:0;top:79%;height:17%;z-index:2;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 38px,#ffefaf25 40px 43px,transparent 45px 88px);background-size:240px 100px;animation:shimmer 7s ease-in-out infinite alternate}
#lane{position:absolute;inset:0;overflow:hidden;z-index:5;pointer-events:none}
#train{position:absolute;width:44.26%;height:auto!important;aspect-ratio:641/95!important;object-fit:contain!important;max-width:none;left:-48%;top:63.95%;animation:trainRide 23s linear infinite;animation-delay:-12.6s;filter:drop-shadow(0 1px 1px #2a395255)}
#rail{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#plane{position:absolute;width:12.5%;height:auto!important;aspect-ratio:155/101!important;object-fit:contain!important;max-width:none;top:12%;left:63%;z-index:7;animation:planeRide 18s linear infinite;animation-delay:-2.3s;filter:drop-shadow(0 1px 1px #263d5770)}
#days{position:absolute;z-index:9;left:29.15%;top:52.25%;font-size:3.42cqw;font-family:system-ui,'Noto Sans TC',sans-serif;font-weight:900;line-height:1;letter-spacing:-.08em;font-variant-numeric:tabular-nums;color:#263146;white-space:nowrap}
#night{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .6s;background:radial-gradient(circle at 60% 18%,transparent 0 3%,#112a54aa 36%,#11284aaa 70%)}
#stars{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;transition:opacity .6s;background-image:radial-gradient(circle,#fff7bd 1.2px,transparent 2px),radial-gradient(circle,#fff 1px,transparent 2px);background-size:65px 55px,83px 75px;background-position:10px 5px,37px 20px}
#weather{position:absolute;inset:0;z-index:10;pointer-events:none;width:100%;height:100%}
#hero[data-weather=night] #night,#hero[data-weather=night] #stars{opacity:1}
#hero[data-night="true"] #night{opacity:1}
#hero[data-night="true"][data-weather=night] #stars{opacity:1}
#hero[data-night="true"] #sun-disc{opacity:0!important}
#hero[data-night="true"] #rail-copy{filter:brightness(.58) saturate(.72)!important}
#hero[data-night="true"] #train{filter:brightness(.64) saturate(.68) drop-shadow(0 1px 1px #27355066)!important}
#hero[data-night="true"] #plane{filter:brightness(.72) saturate(.75)!important}
body[data-weather-ui="auto"] .controls{display:none!important}
#hero[data-weather=rain] #plate,#hero[data-weather=rain] #rail-copy{filter:brightness(.86) saturate(.76)}#hero[data-weather=snow] #plate,#hero[data-weather=snow] #rail-copy{filter:brightness(1.05) saturate(.79)}#hero[data-weather=night] #plate,#hero[data-weather=night] #rail-copy{filter:brightness(.7) saturate(.7)}
#hero[data-weather=night] #plane{filter:brightness(.9)}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px 11px;background:#fffaf5}
.controls button{min-height:42px;border:2px solid #5c6a81;border-radius:999px;background:#fffdfa;font-size:14px;color:#243653;font-weight:800;cursor:pointer;touch-action:manipulation}
.controls button[aria-pressed=true]{background:#d8e8ff;border-color:#263146}
@media(max-width:480px){#hero{border-width:1.5px;border-radius:18px}.controls{gap:5px;padding:7px 9px}.controls button{min-height:32px;font-size:12px;border-width:1.5px}}
@media(prefers-reduced-motion:reduce){#train,#plane,#water{animation:none!important}#train{left:30%}#plane{left:67%}}
@keyframes trainRide{from{left:-48%}to{left:105%}}@keyframes planeRide{from{left:63%;top:12%}to{left:111%;top:1%}}@keyframes shimmer{from{opacity:.10;background-position:0 0}to{opacity:.55;background-position:135px 4px}}

/* Scene12 weather repair: matched sunless sky, no building or train re-render. */
#hero,#scene{background:#8db8fa}
#sun-disc{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s}
#hero[data-weather=sun] #sun-disc{opacity:1}
#sun-disc .sun-halo{fill:#fff4b2;opacity:.22}
#sun-disc .sun-ring{fill:none;stroke:#fff4aa;stroke-width:5.5;stroke-dasharray:11 13;stroke-linecap:round}
#sun-disc .sun-core{fill:#ffef9d;stroke:#efc451;stroke-width:5}

/* Restore bridge foreground using exact same pixels as original plate (not a
   competing hand-drawn SVG). Image clone is clipped to the foreground rail only. */
#rail-copy{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:6;pointer-events:none;clip-path:inset(69.8% 0 26.5% 0)}
/* Date label is real current-trip data; the old sample date is removed from plate pixels. */
#trip-dates{position:absolute;z-index:9;left:6.3%;top:40.2%;width:53%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#263146;font-size:2.7cqw;font-weight:900;font-family:system-ui,'Noto Sans TC',sans-serif;line-height:1.16;text-shadow:0 .6px 0 #b0c7e5}
</style></head><body><section id="hero" data-weather="cloud" aria-label="首爾漢江動態插畫及天氣選擇"><div id="scene">

(()=>{'use strict';let departure='',daysOfTrip=0,tripName='旅行',weather='cloud',particles=[];const autoMode=new URLSearchParams(location.search).get('mode')==='auto';if(autoMode)document.body.dataset.weatherUi='auto';const el=document.getElementById('hero'),c=document.getElementById('weather'),ctx=c.getContext('2d');let width=1448,height=946;
function date(){
 const label=document.getElementById('trip-dates'),counter=document.getElementById('days');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(departure)){label.textContent='旅行日期待設定';counter.textContent='—';return}
 const [yy,mm,dd]=departure.split('-').map(Number);
 const start=Date.UTC(yy,mm-1,dd);
 if(!Number.isFinite(start)||new Date(start).toISOString().slice(0,10)!==departure){label.textContent='旅行日期待核對';counter.textContent='—';return}
 const duration=Math.max(1,Math.min(120,Number(daysOfTrip)||1));
 const end=new Date(start+(duration-1)*86400000);
 label.textContent=departure.replace(/-/g,'/')+'－'+String(end.getUTCMonth()+1).padStart(2,'0')+'/'+String(end.getUTCDate()).padStart(2,'0')+' · '+String(tripName).slice(0,8);
 const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const q=Object.fromEntries(p.map(x=>[x.type,x.value]));
 const now=Date.UTC(+q.year,+q.month-1,+q.day);
 counter.textContent=String(Math.max(0,Math.ceil((start-now)/86400000)));
}

function installExactRailClone(img){
 /* Previous full-width cloned rail covered the original bridge with a second,
    vertically shifted railing. Keep exactly one rail foreground. */
 document.getElementById('rail-copy')?.remove();
 const prior=document.getElementById('rail-joints');
 if(prior)return;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.id='rail-joints';svg.setAttribute('viewBox','0 0 1448 946');
 svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');
 svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;';
 // Connect the only two steps of the source illustration, rather than repeat
 // a complete railing over the entire river.
 svg.innerHTML='<g fill="none" stroke-linecap="round" stroke-linejoin="round">'
 +'<path d="M536 691Q575 689 625 652M1208 652Q1250 667 1304 692" stroke="#334763" stroke-width="12"/>'

 +'</g>';
 img.after(svg);
}

   from nearby original sky pixels; no buildings, railings or train are edited. */
function removePrintedSampleDate(){
 const img=document.getElementById('plate');
 if(!img||!img.naturalWidth)return;
 try{
  const w=img.naturalWidth,h=img.naturalHeight;
  const cvs=document.createElement('canvas');cvs.width=w;cvs.height=h;
  const g=cvs.getContext('2d',{willReadFrequently:true});if(!g)throw Error('No canvas context');
  g.drawImage(img,0,0,w,h);
  const raw=g.getImageData(0,0,w,h),pix=raw.data;

   const dst=(y*left+x)*4,at=((y+y0)*w+x+x0)*4;

   if(src[dst]<135&&src[dst+1]<162&&src[dst+2]<196)mask[y*left+x]=1;
  }

  const expanded=mask.slice();
  for(let y=0;y<top;y++)for(let x=0;x<left;x++){
   if(!mask[y*left+x])continue;
   for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
    const nx=x+dx,ny=y+dy;

   }

   // Inverse-distance fill in a neighbourhood; the input is original pixels,
   // not partially patched pixels. This avoids row-aligned stripes.
   for(const radius of [12,20,30,40]){
    for(let dy=-radius;dy<=radius;dy+=3)for(let dx=-radius;dx<=radius;dx+=3){
     const xx=x+dx,yy=y+dy,dist=dx*dx+dy*dy;
     if(xx<0||yy<0||xx>=left||yy>=top||!dist||dist>radius*radius||expanded[yy*left+xx])continue;
     const j=(yy*left+xx)*4,weight=1/Math.pow(dist,1.15);
     r+=src[j]*weight;gr+=src[j+1]*weight;b+=src[j+2]*weight;total+=weight;
    }
    if(total>0)break;
   }
   if(!total)continue;
   const out=((y+y0)*w+x+x0)*4;
   pix[out]=Math.round(r/total);pix[out+1]=Math.round(gr/total);pix[out+2]=Math.round(b/total);
  }
  g.putImageData(raw,0,0);
  img.src=cvs.toDataURL('image/png');
 }catch(err){console.warn('Sky date cleanup unavailable',err)}
 installExactRailClone(img);
}

function choose(v){if(!["sun","rain","snow","night","cloud"].includes(v))return;weather=v;el.dataset.weather=v;el.dataset.night=String(v==='night');document.querySelectorAll('.controls button[data-weather]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.weather===v)));particles=[];for(let i=0;i<90;i++)particles.push({x:Math.random()*width,y:Math.random()*height,s:1+Math.random()*2});}
function tick(){ctx.clearRect(0,0,width,height);if(weather==='rain'){ctx.strokeStyle='#e9f4ff9e';ctx.lineWidth=1;for(const p of particles){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-3,p.y+7+p.s*3);ctx.stroke();p.y+=2.7+p.s*1.8;p.x-=1.3;if(p.y>height){p.y=-10;p.x=Math.random()*width;}}}else if(weather==='snow'){ctx.fillStyle='#ffffffc9';for(const p of particles){ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();p.y+=.25+p.s*.25;p.x+=Math.sin(p.y/18)*.15;if(p.y>height){p.y=-5;p.x=Math.random()*width}}}requestAnimationFrame(tick)}
