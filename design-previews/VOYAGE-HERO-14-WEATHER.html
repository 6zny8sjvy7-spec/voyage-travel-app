<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>VOYAGE｜首爾首頁・四天氣修正 V13</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#fffaf5;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#263146}
#hero{position:relative;width:100%;overflow:hidden;background:#fffaf5;border:none;border-radius:24px;isolation:isolate}
#scene{position:relative;width:100%;aspect-ratio:1448/946;container-type:inline-size;overflow:hidden;isolation:isolate}
#plate{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1;transition:filter .6s ease}
#water{position:absolute;left:25%;right:0;top:79%;height:17%;z-index:2;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 38px,#ffefaf25 40px 43px,transparent 45px 88px);background-size:240px 100px;animation:shimmer 7s ease-in-out infinite alternate}
#lane{position:absolute;inset:0;overflow:hidden;z-index:5;pointer-events:none}
#train{position:absolute;width:44.26%;height:auto!important;aspect-ratio:641/95!important;object-fit:contain!important;max-width:none;left:-48%;top:63.95%;animation:trainRide 23s linear infinite;animation-delay:-12.6s;filter:drop-shadow(0 1px 1px #2a395255)}
#rail{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#plane{position:absolute;width:12.5%;height:auto!important;aspect-ratio:155/101!important;object-fit:contain!important;max-width:none;top:12%;left:63%;z-index:7;animation:planeRide 18s linear infinite;animation-delay:-2.3s;filter:drop-shadow(0 1px 1px #263d5770)}
#days{position:absolute;z-index:9;left:29.15%;top:52.25%;font-size:3.42cqw;font-family:system-ui,'Noto Sans TC',sans-serif;font-weight:900;line-height:1;letter-spacing:-.08em;font-variant-numeric:tabular-nums;color:#263146;white-space:nowrap}
#night{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .6s;background:radial-gradient(circle at 60% 18%,transparent 0 3%,#112a54aa 36%,#11284aaa 70%)}
#stars{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;transition:opacity .6s;background-image:radial-gradient(circle,#fff7bd 1.2px,transparent 2px),radial-gradient(circle,#fff 1px,transparent 2px);background-size:65px 55px,83px 75px;background-position:10px 5px,37px 20px}
#weather{position:absolute;inset:0;z-index:10;pointer-events:none;width:100%;height:100%}
#hero[data-weather=night] #night,#hero[data-weather=night] #stars{opacity:1}
#hero[data-weather=rain] #plate{filter:brightness(.86) saturate(.76)}#hero[data-weather=snow] #plate{filter:brightness(1.05) saturate(.79)}#hero[data-weather=night] #plate{filter:brightness(.7) saturate(.7)}
#hero[data-weather=night] #plane{filter:brightness(.9)}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px 11px;background:#fffaf5;border:3px solid #263146;border-top:0;border-radius:0 0 24px 24px;margin-top:-3px;position:relative;z-index:12}
.controls button{min-height:42px;border:2px solid #5c6a81;border-radius:999px;background:#fffdfa;font-size:14px;color:#243653;font-weight:800;cursor:pointer;touch-action:manipulation}
.controls button[aria-pressed=true]{background:#d8e8ff;border-color:#263146}
@media(max-width:480px){#hero{border-radius:18px}.controls{gap:5px;padding:7px 9px;border-width:2px;border-top:0;border-radius:0 0 18px 18px}.controls button{min-height:32px;font-size:12px;border-width:1.5px}}
@media(prefers-reduced-motion:reduce){#train,#plane,#water{animation:none!important}#train{left:30%}#plane{left:67%}}
@keyframes trainRide{from{left:-48%}to{left:105%}}@keyframes planeRide{from{left:63%;top:12%}to{left:111%;top:1%}}@keyframes shimmer{from{opacity:.10;background-position:0 0}to{opacity:.55;background-position:135px 4px}}

#moon{position:absolute;z-index:4;left:64%;top:8%;width:11%;aspect-ratio:1;border-radius:50%;background:#fceba9;box-shadow:0 0 18px 7px #f5efb04d,0 0 65px 20px #f5efb02e;opacity:0;pointer-events:none;transition:opacity .6s ease}
#moon::after{content:"";position:absolute;left:35%;top:-8%;width:93%;height:99%;border-radius:50%;background:#344a76}
#hero[data-weather=night] #moon{opacity:1}
#hero[data-weather=rain] #plate{filter:brightness(.81) saturate(.72)}
#hero[data-weather=snow] #plate{filter:brightness(1.06) saturate(.76)}
#hero[data-weather=night] #night{background:linear-gradient(90deg,#152d511c 0%,#152d511f 37%,#152d517e 72%,#152d5199 100%)}
#hero[data-weather=night] #plate{filter:brightness(.82) saturate(.72)}

(()=>{'use strict';let departure='2027-01-10',weather='sun',particles=[];const el=document.getElementById('hero'),c=document.getElementById('weather'),ctx=c.getContext('2d');let width=1448,height=946;
function date(){const t=(departure||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!t)return;const dest=Date.UTC(+t[1],+t[2]-1,+t[3]);const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const q=Object.fromEntries(p.map(x=>[x.type,x.value]));const now=Date.UTC(+q.year,+q.month-1,+q.day);const n=Math.max(0,Math.ceil((dest-now)/86400000));document.getElementById('days').textContent=String(n);}
function resize(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);width=r.width;height=r.height;ctx.setTransform(d,0,0,d,0,0);}
function choose(v){weather=v;el.dataset.weather=v;const plate=document.getElementById('plate');if(plate){if(!plate.dataset.sunOriginal)plate.dataset.sunOriginal=plate.src;plate.src=v==='sun'?plate.dataset.sunOriginal:plate.dataset.sunless;} document.querySelectorAll('[data-weather]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.weather===v)));particles=[];for(let i=0;i<90;i++)particles.push({x:Math.random()*width,y:Math.random()*height,s:1+Math.random()*2});}
function tick(){ctx.clearRect(0,0,width,height);if(weather==='rain'){ctx.strokeStyle='#e9f4ff9e';ctx.lineWidth=1;for(const p of particles){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-3,p.y+7+p.s*3);ctx.stroke();p.y+=2.7+p.s*1.8;p.x-=1.3;if(p.y>height){p.y=-10;p.x=Math.random()*width;}}}else if(weather==='snow'){ctx.fillStyle='#ffffffc9';for(const p of particles){ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();p.y+=.25+p.s*.25;p.x+=Math.sin(p.y/18)*.15;if(p.y>height){p.y=-5;p.x=Math.random()*width}}}requestAnimationFrame(tick)}

function reportHeight(){try{parent.postMessage({type:'voyage-hero-size',height:Math.ceil(document.getElementById('hero').getBoundingClientRect().height+2)},location.origin)}catch(e){}};

window.addEventListener('resize',()=>{resize();reportHeight()});resize();choose('sun');date();tick();requestAnimationFrame(reportHeight);
