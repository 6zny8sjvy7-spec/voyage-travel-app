name: VOYAGE production deployment check
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-friends-production.yml'
permissions:
  contents: read
jobs:
  check-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify original public website serves the merged collaboration code
        run: |
          set -eu
          root='https://6zny8sjvy7-spec.github.io/voyage-travel-app/'
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 15 "${root}?qa=$(date +%s)" -o /tmp/voyage-index.html && grep -q 'voyage-friends-v1.js' /tmp/voyage-index.html && curl -fsSL --max-time 15 "${root}v2-review-20261112/voyage-friends-v1.js?qa=$(date +%s)" -o /tmp/voyage-friends.js && grep -q 'voyageFriendsName' /tmp/voyage-friends.js && node --check /tmp/voyage-friends.js; then
              echo "PASS: original public GitHub Pages root and deployed friends script are reachable"
              exit 0
            fi
            sleep 8
          done
          echo "FAIL: new files not verified on original website"
          exit 1
