name: VOYAGE V1 QA
on:
  push:
    branches:
      - work/voyage-v1-integration
  pull_request:
    paths:
      - '**/*.js'
      - 'index.html'
      - 'tests/**'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: |
          node --check voyage-domain.js
          node --check voyage-ui-base.js
          node --check voyage-tools.js
          node --check voyage-import-translate.js
          node --check voyage-cloud.js
          node --check voyage-discover.js
          node --check voyage-map.js
          node --check voyage-journal.js
      - name: Domain and integrated UI tests
        run: node --test tests/voyage.test.cjs
      - name: Confirm all feature scripts wired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          scripts=['voyage-domain.js','voyage-ui-base.js','voyage-tools.js','voyage-import-translate.js','voyage-cloud.js','voyage-discover.js','voyage-map.js','voyage-journal.js']
          for name in scripts:
              assert ('src="./'+name+'"') in html, name+' not loaded'
              assert Path(name).is_file(), name+' missing'
          print('8 module scripts wired and present')
          PY
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install desktop Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run cross-browser functional tests
        run: npm run test:e2e
      - name: Save test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voyage-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
