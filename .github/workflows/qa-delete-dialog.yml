name: VOYAGE production repeated dialog QA
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-delete-dialog.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -eu
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps webkit
          node --input-type=module <<'JS'
          import {webkit} from 'playwright';
          import assert from 'node:assert/strict';
          const root='https://6zny8sjvy7-spec.github.io/voyage-travel-app/';
          const browser=await webkit.launch();
          try {
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await page.goto(root+'?qa=810c4662',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.VoyageUI);
            for(let i=0;i<3;i++){
              await page.evaluate(()=>window.VoyageUI.eventEditor(0,false));
              assert.equal(await page.locator('[id="v1DeleteScheduledEvent"]').count(),1);
              await page.locator('#v1Cancel').click();
            }
            await page.evaluate(()=>window.VoyageUI.eventEditor(0,true));
            assert.equal(await page.locator('[id="v1DeleteScheduledEvent"]').count(),0);
            console.log('PASS: repeated edit has exactly one delete action; new event has none');
          }finally{await browser.close()}
          JS
