name: VOYAGE exact user URL browser inspection
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-exact-user-url.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Open the exact URL the user pasted
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps webkit
          node --input-type=module <<'JS'
          import {webkit} from 'playwright';
          import {createHash} from 'node:crypto';
          const browser=await webkit.launch();
          try {
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            const requested='https://6zny8sjvy7-spec.github.io/voyage-travel-app/?v=a13638a2&utm_source=chatgpt.com';
            const res=await page.goto(requested,{waitUntil:'domcontentloaded',timeout:90000});
            console.log('EXACT_HTTP',res?.status(),'FINAL_URL',page.url(),'TITLE',await page.title());
            await page.waitForTimeout(2500);
            console.log('VISIBLE_HOME', (await page.locator('body').innerText()).slice(0,2500).replaceAll('\n',' | '));
            console.log('SCRIPTS',await page.locator('script[src]').evaluateAll(els=>els.map(e=>e.getAttribute('src'))));
            const html=await res.text();
            console.log('HTML_SHA256',createHash('sha256').update(html).digest('hex'));
            console.log('NICKNAME_TEST',await page.evaluate(()=>{window.VoyageUI?.showPage('collab');return document.body.innerText.slice(-2000)}));
            await page.screenshot({path:'exact-user-url.png',fullPage:true});
            const other=await ctx.newPage();
            const latest=await other.goto('https://6zny8sjvy7-spec.github.io/voyage-travel-app/?v=7815c87e',{waitUntil:'domcontentloaded',timeout:90000});
            console.log('LATEST_HTTP',latest?.status(),'LATEST_SHA256',createHash('sha256').update(await latest.text()).digest('hex'));
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: exact-user-url
          path: exact-user-url.png
